[project]
name = "shmqueue"
version = "0.1.0"
description = "High-throughput shared-memory message queue middleware for inter-process batch data exchange"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
prefetch = ["torch>=2.0"]      # pin_memory path in Consumer.start_prefetch
monitor = ["pyzmq>=25"]        # LogSink ZMQ PUSH metrics forwarding
dev = ["pytest>=7", "pytest-benchmark"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["shmqueue"]
